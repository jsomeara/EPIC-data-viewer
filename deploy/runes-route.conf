location = /epic-data-viewer { return 308 /epic-data-viewer/; }
location /epic-data-viewer/ {
    set $epic_upstream epic-data-viewer:8767;
    rewrite ^/epic-data-viewer/(.*)$ /$1 break;
    proxy_pass http://$epic_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
}

# Nginx streams large downloads and supports byte ranges without using app workers.
location ~ ^/epic-data-viewer/downloads/([a-z0-9_]+\.parquet|manifest\.json)$ {
    alias /downloads/epic-data-viewer/$1;
    default_type application/vnd.apache.parquet;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "private, no-store";
}
