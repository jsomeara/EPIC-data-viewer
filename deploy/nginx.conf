# Put these locations in your authenticated team site's server block.
# For large downloads, mount the verified Parquet output directory at /srv/epic-parquet.
location = /epic-data-viewer { return 308 /epic-data-viewer/; }
location ~ ^/epic-data-viewer/downloads/([a-z0-9_]+\.parquet|manifest\.json)$ {
    alias /srv/epic-parquet/$1;
    default_type application/vnd.apache.parquet;
    add_header Content-Disposition "attachment";
}
location /epic-data-viewer/ {
    proxy_pass http://127.0.0.1:8767/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
