name: rune-epic-data-viewer
services:
  app:
    build: ./src
    image: runes/epic-data-viewer:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../data/epic-data-viewer/data_fixed:/app/data_fixed:ro
      - ../../data/epic-data-viewer/parquet:/app/parquet:ro
    networks:
      runes:
        aliases:
          - epic-data-viewer
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  runes:
    external: true
    name: runes
