services:
  viewer:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - ./data_fixed:/app/data_fixed:ro
      - ./parquet:/app/parquet:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
